<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #f6f2ec;
      --surface: #fffdf9;
      --surface-soft: #f2e8dc;
      --text: #181512;
      --muted: #6b6258;
      --line: #e2d4c3;
      --primary: #7f1d1d;
      --primary-dark: #5f1414;
      --danger: #be123c;
      --ok: #15803d;
      --radius: 8px;
      --shadow: 0 14px 34px rgba(46, 31, 20, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }
    button, input, textarea, select { font: inherit; }
    button, a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 0 14px;
      background: var(--primary);
      color: white;
      font-weight: 850;
      cursor: pointer;
      text-decoration: none;
    }
    button:hover, a.button:hover { background: var(--primary-dark); }
    button.secondary, a.secondary { background: white; border-color: var(--line); color: var(--text); }
    button.secondary:hover, a.secondary:hover { background: var(--surface-soft); }
    button.danger { background: #fff1f2; border-color: #fecdd3; color: var(--danger); }
    button.danger:hover { background: #ffe4e6; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 292px minmax(0, 1fr); }
    aside {
      background: #211815;
      color: #f8efe3;
      padding: 22px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 22px; padding: 0 4px; }
    .mark {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff7ed;
      color: var(--primary);
      font-weight: 950;
    }
    .brand strong { display: block; line-height: 1.15; }
    .brand span { color: #d8c9b6; font-size: .88rem; }
    nav { display: grid; gap: 4px; }
    nav button {
      width: 100%;
      justify-content: flex-start;
      background: transparent;
      color: #e8dcca;
      border-color: transparent;
      font-weight: 750;
    }
    nav button:hover, nav button.active { background: rgba(255, 255, 255, .1); color: white; }
    .sidebar-foot { margin-top: 20px; border-top: 1px solid rgba(255, 255, 255, .16); padding-top: 16px; display: grid; gap: 10px; }
    .workspace { min-width: 0; display: grid; grid-template-rows: auto 1fr; }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(246, 242, 236, .92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: 16px 22px;
    }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .topbar h1 { margin: 0; font-size: 1.35rem; line-height: 1.2; }
    .topbar p { margin: 4px 0 0; color: var(--muted); font-size: .94rem; }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .status { min-height: 24px; color: var(--muted); font-size: .92rem; }
    .status.ok { color: var(--ok); font-weight: 850; }
    .status.error { color: var(--danger); font-weight: 850; }
    main { width: min(1240px, calc(100% - 32px)); margin: 22px auto 48px; display: grid; gap: 18px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .panel-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 14px; align-items: start; }
    .panel-head h2 { margin: 0; font-size: 1.18rem; line-height: 1.2; }
    .panel-head p { margin: 6px 0 0; color: var(--muted); font-size: .94rem; }
    .panel-body { padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .field { display: grid; gap: 7px; align-content: start; }
    .field.full { grid-column: 1 / -1; }
    label { font-weight: 850; font-size: .92rem; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }
    textarea { min-height: 92px; resize: vertical; }
    input:focus, textarea:focus, select:focus { border-color: #b45309; box-shadow: 0 0 0 3px rgba(180, 83, 9, .16); }
    .list { display: grid; gap: 14px; }
    .item { border: 1px solid var(--line); border-radius: var(--radius); background: #fffaf4; padding: 14px; display: grid; gap: 12px; }
    .item-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; color: var(--muted); font-size: .9rem; font-weight: 850; }
    .mini-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .mini-actions button { min-height: 34px; padding: 0 10px; font-size: .88rem; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .metric { background: white; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
    .metric strong { display: block; font-size: 1.45rem; }
    .metric span { color: var(--muted); font-size: .9rem; }
    .product-admin {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    .thumb {
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface-soft);
      border: 1px solid var(--line);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .upload-box {
      display: grid;
      gap: 8px;
    }
    .upload-box input[type="file"] {
      padding: 9px;
      background: #fff;
    }
    .upload-note {
      color: var(--muted);
      font-size: .86rem;
    }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .score { display: grid; gap: 10px; }
    .score-bar { height: 12px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
    .score-bar i { display: block; height: 100%; width: var(--score, 0%); background: var(--primary); }
    .table { display: grid; gap: 8px; }
    .row { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding: 10px 0; color: var(--muted); }
    .row strong { color: var(--text); overflow-wrap: anywhere; }
    .json-editor { min-height: 68vh; font-family: Consolas, "Liberation Mono", monospace; font-size: .92rem; line-height: 1.5; }
    .login { position: fixed; inset: 0; z-index: 30; background: rgba(24, 21, 18, .72); display: grid; place-items: center; padding: 18px; }
    .login-card { width: min(420px, 100%); background: white; border-radius: 10px; padding: 22px; box-shadow: 0 24px 70px rgba(0, 0, 0, .26); }
    .login-card h2 { margin: 0 0 8px; font-size: 1.35rem; }
    .login-card p { color: var(--muted); margin: 0 0 16px; }
    .hidden { display: none !important; }
    .scroll-tools {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 25;
      display: grid;
      gap: 10px;
    }
    .scroll-tools button {
      width: 46px;
      height: 46px;
      min-height: 46px;
      border-radius: 50%;
      padding: 0;
      background: rgba(33, 24, 21, .9);
      border-color: rgba(255, 255, 255, .42);
      color: #fffdf9;
      box-shadow: 0 12px 28px rgba(46, 31, 20, .24);
      font-size: 1.15rem;
      font-weight: 950;
      line-height: 1;
    }
    .scroll-tools button:hover {
      background: var(--primary);
    }
    @media (max-width: 980px) {
      .shell { grid-template-columns: 1fr; }
      aside { position: static; height: auto; }
      nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid, .grid-3, .split, .summary, .product-admin { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      header { position: static; }
      .topbar { display: grid; }
      .actions { justify-content: stretch; }
      .actions button, .actions a { width: 100%; }
      nav { grid-template-columns: 1fr; }
      .scroll-tools {
        right: 12px;
        bottom: 12px;
      }
      .scroll-tools button {
        width: 42px;
        height: 42px;
        min-height: 42px;
      }
    }
  </style>
</head>

    const translateVietnameseUi = (root = document.body) => {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach((node) => {
        const key = node.nodeValue.trim();
        if (viText.has(key)) node.nodeValue = node.nodeValue.replace(key, viText.get(key));
        node.nodeValue = node.nodeValue
          .replaceAll("Them ", "Thêm ")
          .replaceAll("danh muc", "danh mục")
          .replaceAll("san pham", "sản phẩm")
          .replaceAll("loi ich", "lợi ích")
          .replaceAll("Danh muc", "Danh mục")
          .replaceAll("San pham", "Sản phẩm")
          .replaceAll("Loi ich", "Lợi ích")
          .replaceAll("Tieu de", "Tiêu đề")
          .replaceAll("Mo ta", "Mô tả")
          .replaceAll("Cau hoi", "Câu hỏi");
      });
    };

    const normalizeData = (data) => {
      const base = clone(fallbackData);
      const incoming = data && typeof data === "object" ? data : {};
      return {
        ...base,
        ...incoming,
        brand: { ...base.brand, ...(incoming.brand || {}) },
        hero: { ...base.hero, ...(incoming.hero || {}), primaryCta: { ...base.hero.primaryCta, ...(incoming.hero?.primaryCta || {}) }, secondaryCta: { ...base.hero.secondaryCta, ...(incoming.hero?.secondaryCta || {}) } },
        final: { ...base.final, ...(incoming.final || {}), primaryCta: { ...base.final.primaryCta, ...(incoming.final?.primaryCta || {}) }, secondaryCta: { ...base.final.secondaryCta, ...(incoming.final?.secondaryCta || {}) } },
        footer: { ...base.footer, ...(incoming.footer || {}) },
        categories: Array.isArray(incoming.categories) ? incoming.categories : base.categories,
        products: Array.isArray(incoming.products) ? incoming.products : [],
        benefits: Array.isArray(incoming.benefits) ? incoming.benefits : [],
        ads: {
          ...base.ads,
          ...(incoming.ads || {}),
          slots: Array.isArray(incoming.ads?.slots) ? incoming.ads.slots : base.ads.slots,
        },
        faqIntro: { ...base.faqIntro, ...(incoming.faqIntro || {}) },
        faq: Array.isArray(incoming.faq) ? incoming.faq : [],
      };
    };

    const pathGet = (path) => path.split(".").reduce((current, part) => current?.[part], state.data);
    const pathSet = (path, value) => {
      const parts = path.split(".");
      let current = state.data;
      for (const part of parts.slice(0, -1)) {
        if (current[part] === undefined) current[part] = {};
        current = current[part];
      }
      current[parts.at(-1)] = value;
      markDirty();
    };
    const updateStatus = (message, type = "") => { statusBox.textContent = message; statusBox.className = `status ${type}`.trim(); };
    const markDirty = () => { state.dirty = true; updateStatus("Có thay đổi chưa lưu", "error"); };

    const field = (label, path, type = "input") => {
      const value = pathGet(path) ?? "";
      const tag = type === "textarea" ? "textarea" : "input";
      return `<div class="field ${type === "textarea" ? "full" : ""}"><label>${escapeHtml(label)}</label><${tag} data-path="${escapeHtml(path)}" ${tag === "input" ? `value="${escapeHtml(value)}"` : ""}>${tag === "textarea" ? escapeHtml(value) : ""}</${tag}></div>`;

              <div class="grid">

          `).join("")}

        <div style="height:14px"></div><button class="secondary" data-add="${path}">Them ${escapeHtml(title.toLowerCase())}</button>

    const calculateSeoScore = (data) => {
      const products = data.products || [];
      const categories = data.categories || [];
      const checks = [
        ["Title dai 35-65 ky tu", (data.title || "").length >= 35 && (data.title || "").length <= 65],
        ["Meta description dai 120-170 ky tu", (data.description || "").length >= 120 && (data.description || "").length <= 170],
        ["Hero co thong diep ro", (data.hero?.title || "").length >= 24],
        ["Co anh hero", Boolean(data.hero?.image)],
        ["Co it nhat 3 danh muc", categories.length >= 3],
        ["Co it nhat 6 san pham", products.length >= 6],
        ["Moi san pham co anh va link mua", products.length > 0 && products.every((item) => item.image && item.buyUrl)],
        ["Co FAQ tu 3 cau tro len", (data.faq || []).length >= 3],
      ];
      const passed = checks.filter(([, ok]) => ok).length;
      return { score: Math.round((passed / checks.length) * 100), checks: checks.map(([label, ok]) => ({ label, ok })) };
    };

    const renderCategories = () => listEditor("Danh muc", "ID viet lien khong dau, dung de gan vao Category ID cua san pham.", "categories", [["ID", "id"], ["Ten hien thi", "label"]]);

    const renderProducts = () => {

      content.innerHTML = panel("San pham", "Quan ly anh, gia, gia goc, nhan, danh muc va link mua rieng cho tung san pham.", `

                  <div class="field full upload-box">

                  <div class="field"><label>Noi bat</label><select data-path="products.${index}.featured"><option value="true">Co</option><option value="false">Khong</option></select></div>

        <div class="list">

                <div class="field">

                  <select data-path="ads.slots.${index}.enabled">

                </div>
                ${field("Ad Slot ID", `ads.slots.${index}.slotId`)}
                ${field("Định dạng", `ads.slots.${index}.format`)}
                <div class="field full">
                  <label>Vị trí kỹ thuật</label>
                  <input value="${escapeHtml(slot.position)}" readonly>

    const renderBenefits = () => listEditor("Loi ich", "Cac card giai thich ly do khach nen mua hang.", "benefits", [["Tieu de", "title"], ["Mo ta", "text", "textarea"]]);
    const renderFaq = () => {
      content.innerHTML = panel("FAQ intro", "Tieu de va mo ta cho khoi FAQ.", `<div class="grid">${field("Tieu de", "faqIntro.title")}${field("Mo ta", "faqIntro.text", "textarea")}</div>`) + listEditor("FAQ", "Quan ly cau hoi va cau tra loi.", "faq", [["Cau hoi", "title"], ["Tra loi", "text", "textarea"]]);
    };
    const renderFinal = () => {
      content.innerHTML = panel("CTA cuoi trang", "Thong diep chot va hai CTA cuoi.", `<div class="grid">${field("Tieu de", "final.title", "textarea")}${field("Lead", "final.lead", "textarea")}${ctaFields("final.primaryCta")}${ctaFields("final.secondaryCta")}</div>`) + panel("Footer", "Text va link footer.", `<div class="grid">${field("Text", "footer.text")}${field("Nhan link", "footer.label")}${field("Link", "footer.href")}</div>`);
    };
    const renderJson = () => {
      content.innerHTML = panel("JSON nang cao", "Dung khi can sua nhanh cau truc phuc tap. Hay format/kiem tra truoc khi luu.", `<textarea class="json-editor" id="jsonEditor" spellcheck="false">${escapeHtml(JSON.stringify(state.data, null, 2))}</textarea><div style="height:14px"></div><div class="mini-actions"><button class="secondary" id="formatJson">Format</button><button class="secondary" id="applyJson">Ap dung vao form</button></div>`);
      $("#formatJson").addEventListener("click", () => {

        editor.value = JSON.stringify(JSON.parse(editor.value), null, 2);
        updateStatus("JSON hop le", "ok");

    const render = () => {
      const active = sections.find(([id]) => id === state.active);
      $("#sectionTitle").textContent = active[1];
      $("#sectionHint").textContent = active[2];
      $("#nav").innerHTML = sections.map(([id, label]) => `<button class="${id === state.active ? "active" : ""}" data-section="${id}">${escapeHtml(label)}</button>`).join("");
      const map = { overview: renderOverview, analytics: renderAnalytics, seo: renderSeo, hero: renderHero, categories: renderCategories, products: renderProducts, ads: renderAds, benefits: renderBenefits, faq: renderFaq, final: renderFinal, json: renderJson };

      bindInputs();
      translateVietnameseUi(document.body);

    const emptyForPath = (path) => {
      if (path === "categories") return { id: "new-category", label: "Danh muc moi" };
      if (path === "products") return { id: `product-${Date.now()}`, categoryId: state.data.categories?.[0]?.id || "fashion", name: "San pham moi", price: "0d", oldPrice: "", badge: "New", image: "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=85", buyUrl: "https://thaochi-boutique.vercel.app/#contact", description: "Mo ta ngan cho san pham.", featured: false };
      if (path === "benefits" || path === "faq") return { title: "", text: "" };
      return {};
    };

    const bindInputs = () => {
      content.querySelectorAll("[data-path]").forEach((input) => {
        input.addEventListener("input", (event) => {
          const path = event.target.dataset.path;
          let value = event.target.value;
          if (path.endsWith(".featured") || path.endsWith(".enabled")) value = value === "true";
          pathSet(path, value);
          if (state.active === "products" && path.includes(".image")) render();
        });
      });
      content.querySelectorAll("[data-upload-product]").forEach((input) => {
        input.addEventListener("change", async (event) => {
          const file = event.target.files?.[0];
          if (!file) return;
          if (!file.type.startsWith("image/")) {
            updateStatus("Vui lòng chọn file ảnh.", "error");
            event.target.value = "";
            return;
          }
          if (file.size > 6 * 1024 * 1024) {
            updateStatus("File quá lớn. Vui lòng dùng ảnh tối đa 6MB.", "error");
            event.target.value = "";
            return;
          }

          const index = Number(event.target.dataset.uploadProduct);
          const product = state.data.products[index];
          updateStatus("Đang tải ảnh lên...");

          try {
            const dataUrl = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = reject;
              reader.readAsDataURL(file);
            });
            const response = await fetch("/api/upload", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                filename: file.name,
                productId: product?.id || `product-${index + 1}`,
                dataUrl,
              }),
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || "Không tải ảnh lên được");

            pathSet(`products.${index}.image`, payload.url);
            updateStatus("Đã tải ảnh lên. Bấm Lưu thay đổi để cập nhật ra site.", "ok");
            render();
          } catch (error) {
            updateStatus(error.message, "error");
          } finally {
            event.target.value = "";
          }
        });
      });
      content.querySelectorAll("[data-add]").forEach((button) => {
        button.addEventListener("click", () => {
          const path = button.dataset.add;
          pathGet(path).push(emptyForPath(path));
          render();
          markDirty();
        });
      });
      content.querySelectorAll("[data-remove]").forEach((button) => {
        button.addEventListener("click", () => {
          const [path, index] = button.dataset.remove.split(":");
          pathGet(path).splice(Number(index), 1);
          render();
          markDirty();
        });
      });
      content.querySelectorAll("[data-move]").forEach((button) => {
        button.addEventListener("click", () => {
          const [path, indexRaw, directionRaw] = button.dataset.move.split(":");
          const index = Number(indexRaw);
          const direction = Number(directionRaw);
          const items = pathGet(path);
          const target = index + direction;
          if (target < 0 || target >= items.length) return;
          [items[index], items[target]] = [items[target], items[index]];
          render();
          markDirty();
        });
      });
    };

    const syncVisibleFormToState = () => {
      if (!state.data || state.active === "json") return;
      content.querySelectorAll("[data-path]").forEach((input) => {
        let value = input.value;
        if (input.dataset.path.endsWith(".featured") || input.dataset.path.endsWith(".enabled")) value = value === "true";
        pathSet(input.dataset.path, value);
      });
    };

    const loadContent = async () => {
      updateStatus("Đang tải...");
      const [response, metricsResponse] = await Promise.all([fetch("/api/content"), fetch("/api/metrics").catch(() => null)]);
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "Không tải được nội dung");
      if (metricsResponse?.ok) state.metrics = await metricsResponse.json();
      state.data = normalizeData(payload.data);
      state.updatedAt = payload.updated_at;
      state.dirty = false;
      updateStatus("Đã tải từ Supabase - chưa có thay đổi", "ok");
      render();
    };

    const saveContent = async () => {
      if (state.active === "json") {
        const editor = $("#jsonEditor");
        if (editor) state.data = normalizeData(JSON.parse(editor.value));
      } else {
        syncVisibleFormToState();
      }
      updateStatus("Đang lưu...");
      const response = await fetch("/api/content", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ data: clone(state.data) }) });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "Không lưu được");
      const verifyResponse = await fetch(`/api/content?verify=${Date.now()}`, { cache: "no-store" });
      const verified = await verifyResponse.json();
      if (!verifyResponse.ok) throw new Error(verified.error || "Đã lưu nhưng không đọc lại được");
      state.data = normalizeData(verified.data);
      state.updatedAt = verified.updated_at;
      state.dirty = false;
      updateStatus(`Đã lưu và đọc lại từ Supabase ${verified.updated_at}`, "ok");
      render();
    };

    $("#nav").addEventListener("click", (event) => {
      const button = event.target.closest("[data-section]");
      if (!button) return;
      state.active = button.dataset.section;
      render();
    });
    $("#reloadBtn").addEventListener("click", () => loadContent().catch((error) => updateStatus(error.message, "error")));
    $("#saveBtn").addEventListener("click", () => saveContent().catch((error) => updateStatus(error.message, "error")));
    $("#jsonBtn").addEventListener("click", () => { state.active = "json"; render(); });
    $("#logoutBtn").addEventListener("click", () => {
      sessionStorage.removeItem("affiliate_admin_logged_in");
      state.loggedIn = false;
      $("#login").classList.remove("hidden");
      $("#passwordInput").value = "";
      $("#usernameInput").focus();
      updateStatus("Đã đăng xuất");
    });
    $("#viewSiteBtn").addEventListener("click", (event) => {
      event.preventDefault();
      window.open(`/?cms=${Date.now()}`, "_blank", "noopener");
    });
    document.querySelectorAll("[data-scroll-target]").forEach((button) => {
      button.addEventListener("click", () => {
        const top = button.dataset.scrollTarget === "top" ? 0 : document.documentElement.scrollHeight;
        window.scrollTo({ top, behavior: "smooth" });
      });
    });
    $("#loginForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const username = $("#usernameInput").value.trim();
      const password = $("#passwordInput").value;
      if (username !== "beedzai" || password !== "aqswde123") {
        $("#loginError").textContent = "Tài khoản hoặc mật khẩu không đúng.";
        return;
      }
      sessionStorage.setItem("affiliate_admin_logged_in", "true");
      state.loggedIn = true;
      $("#login").classList.add("hidden");
      loadContent().catch((error) => updateStatus(error.message, "error"));
    });

    if (state.loggedIn) {
      $("#login").classList.add("hidden");
      loadContent().catch((error) => updateStatus(error.message, "error"));
    } else {
      $("#usernameInput").focus();
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Affiliate Skills Landing Page</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --line: #dbe2ea;
      --primary: #0f766e;
      --danger: #be123c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: white;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .bar {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }

    h1 {
      font-size: 1.35rem;
      margin: 0;
    }

    main {
      width: min(1180px, calc(100% - 28px));
      margin: 24px auto 48px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 18px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    label {
      display: block;
      font-weight: 800;
      margin: 0 0 7px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
      font: inherit;
      background: white;
      color: var(--text);
    }

    textarea {
      min-height: 68vh;
      resize: vertical;
      font-family: Consolas, "Liberation Mono", monospace;
      font-size: .92rem;
      line-height: 1.5;
    }

    button,
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      background: var(--primary);
      color: white;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
    }

    button.secondary,
    a.secondary {
      background: #111827;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .status {
      color: var(--muted);
      font-size: .94rem;
      min-height: 24px;
    }

    .error {
      color: var(--danger);
      font-weight: 800;
    }

    .hint {
      color: var(--muted);
      font-size: .92rem;
      margin: 8px 0 0;
    }

    @media (max-width: 820px) {
      main,
      .bar {
        display: block;
      }

      .panel + .panel {
        margin-top: 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1>Admin Affiliate Skills</h1>
      <a class="button secondary" href="/">Xem trang</a>
    </div>
  </header>

  <main>
    <section class="panel stack">
      <div>
        <label for="secret">Admin secret</label>
        <input id="secret" type="password" autocomplete="current-password" placeholder="Nhap admin secret">
        <p class="hint">Secret duoc luu trong trinh duyet cua ban de goi API ghi Supabase.</p>
      </div>
      <button id="load">Tai noi dung</button>
      <button id="save">Luu vao Supabase</button>
      <button id="format" class="secondary">Format JSON</button>
      <div id="status" class="status"></div>
    </section>

    <section class="panel">
      <label for="editor">Toan bo noi dung landing page</label>
      <textarea id="editor" spellcheck="false"></textarea>
      <p class="hint">Moi thay doi o day se luu vao Supabase. Deploy/code moi tren GitHub khong ghi de du lieu nay.</p>
    </section>
  </main>

  <script>
    const editor = document.querySelector("#editor");
    const secret = document.querySelector("#secret");
    const statusBox = document.querySelector("#status");

    secret.value = localStorage.getItem("affiliate_admin_secret") || "";

    const setStatus = (message, isError = false) => {
      statusBox.textContent = message;
      statusBox.className = isError ? "status error" : "status";
    };

    const loadContent = async () => {
      setStatus("Dang tai...");
      const response = await fetch("/api/content");
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "Khong tai duoc noi dung");
      editor.value = JSON.stringify(payload.data, null, 2);
      setStatus(`Da tai. Cap nhat lan cuoi: ${payload.updated_at || "khong ro"}`);
    };

    const saveContent = async () => {
      const adminSecret = secret.value.trim();
      if (!adminSecret) throw new Error("Can nhap admin secret");

      const data = JSON.parse(editor.value);
      localStorage.setItem("affiliate_admin_secret", adminSecret);
      setStatus("Dang luu...");

      const response = await fetch("/api/content", {
        method: "PUT",
        headers: {
          "content-type": "application/json",
          "x-admin-secret": adminSecret,
        },
        body: JSON.stringify({ data }),
      });

      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || "Khong luu duoc noi dung");
      editor.value = JSON.stringify(payload.data, null, 2);
      setStatus(`Da luu vao Supabase: ${payload.updated_at}`);
    };

    document.querySelector("#load").addEventListener("click", () => {
      loadContent().catch((error) => setStatus(error.message, true));
    });

    document.querySelector("#save").addEventListener("click", () => {
      saveContent().catch((error) => setStatus(error.message, true));
    });

    document.querySelector("#format").addEventListener("click", () => {
      try {
        editor.value = JSON.stringify(JSON.parse(editor.value), null, 2);
        setStatus("JSON hop le.");
      } catch (error) {
        setStatus(error.message, true);
      }
    });

    loadContent().catch((error) => setStatus(error.message, true));
  </script>
</body>
</html>
